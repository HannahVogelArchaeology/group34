title: "Disability Heritage: Archaeology with Difference"
description: "Digital Exhibition"

baseurl: "/group34"
url: ""

markdown: kramdown

sass:
  sass_dir: _sass
  style: compressed

collections:
  objects:
    output: true
  shelves:
    output: true

defaults:
  - scope:
      path: ""
      type: "objects"
    values:
      layout: object

# Test tooling and scripts are not part of the published site.
# Setting "exclude" replaces Jekyll's defaults, so the default entries are repeated here.
exclude:
  - .sass-cache
  - .jekyll-cache
  - gemfiles
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - tests
  - scripts
  - TESTING.md
