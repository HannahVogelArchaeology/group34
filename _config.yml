title: "Digital Exhibition"
email: "info@exhibition.org"
description: "A digital archaeology exhibition showcasing historical artifacts in interactive shelves and 3D views."
baseurl: ""
url: "https://hannahvogelarchaeology.github.io"

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag

sass:
  style: compressed

collections:
  shelves:
    output: true
    permalink: /shelves/:path/
  objects:
    output: true
    permalink: /objects/:path/

defaults:
  - scope:
      path: ""
    values:
      layout: "default"
  - scope:
      path: ""
      type: "shelves"
    values:
      layout: "shelf"
  - scope:
      path: ""
      type: "objects"
    values:
      layout: "object"
