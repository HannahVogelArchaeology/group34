title: "Disability Heritage: Archaeology with Difference"
description: "Digital Exhibition"
lang: en-AU
baseurl: "/group34"
url: "https://hannahvogelarchaeology.github.io"
repository: HannahVogelArchaeology/group34
markdown: kramdown

author: Group 34

sass:
  sass_dir: _sass
  style: compressed

collections:
  objects:
    output: true
  shelves:
    output: true

defaults:
  - scope:
      path: ""
      type: "objects"
    values:
      layout: object

# Test tooling and scripts are not part of the published site.
# Setting "exclude" replaces Jekyll's defaults, so the default entries are repeated here.
exclude:
  - .sass-cache
  - .jekyll-cache
  - gemfiles
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - tests
  - scripts
  - TESTING.md
  # Internal project files that should not be published on the website
  - AGENTS.md
  - CLAUDE.md
  - README.md
  - NOTICE.md
  - CITATION.cff

# Shown in the footer of the home page only (_includes/footer.html).
acknowledgement_text: |
  This research was undertaken on the lands of the Wallumatta of the Dharug Nation, whose cultures and customs have nurtured and continue to nurture this land, since the Dreaming.

  This project is supported by the Commonwealth through an Australian Government Research Training Program Scholarship *[DOI: [https://doi.org/10.82133/C42F-K220](https://doi.org/10.82133/C42F-K220)]* and the National Disability Research Partnership Disability Leadership Program.
