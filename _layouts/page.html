---
layout: default
---
<div class="page-wrapper" role="region" aria-label="{{ page.title | escape }} Page">
  <h1 class="page-title" aria-label="Page Title: {{ page.title | escape }}">{{ page.title }}</h1>
  <div class="page-content" aria-label="{{ page.title | escape }} Content">
    {{ content }}
  </div>
</div>
