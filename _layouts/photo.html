---
layout: default
---

<main class="photo-viewer-page" id="photo-viewer" aria-label="Photo viewer">

<!--
  //Photo gallery data is generated at build time to keep photo URLs short.
  Objects and shelves are regular pages (not Jekyll collections), so they are read from site.pages.
-->
  {% assign object_pages = site.pages | where: "layout", "object" %}
  {% assign shelf_pages = site.pages | where_exp: "item", "item.layout contains '-shelf'" %}
  <script type="application/json" id="photoGalleryData">
  [
    {% for object in object_pages %}
    {
      "key": {{ object.url | relative_url | jsonify }},
      "object": {{ object.title | jsonify }},
      "museumNumber": {{ object.museum_number | default: object.acq_no | default: object.acquisition_number | jsonify }},
      "return": {{ object.url | relative_url | jsonify }},
      "images": [
        {% for gallery_image in object.gallery_images %}
          {% assign image_exists = false %}
          {% for static_file in site.static_files %}
            {% if static_file.path == gallery_image.src %}
              {% assign image_exists = true %}
            {% endif %}
          {% endfor %}
          {
            "src": {% if image_exists %}{{ gallery_image.src | relative_url | jsonify }}{% else %}{{ object.image | relative_url | jsonify }}{% endif %},
            "label": {{ gallery_image.label | jsonify }},
            "caption": {{ gallery_image.caption | jsonify }},
            "alt": {{ gallery_image.alt | default: gallery_image.caption | jsonify }}
          }{% unless forloop.last %},{% endunless %}
        {% endfor %}
      ]
    },
    {% endfor %}
    {% for shelf in shelf_pages %}
    {
      "key": {{ shelf.url | relative_url | jsonify }},
      "object": {{ shelf.object_title | default: shelf.shelf_title | jsonify }},
      "museumNumber": "",
      "return": {{ shelf.url | relative_url | jsonify }},
      "images": [
        {% if shelf.gallery_images %}
          {% for image in shelf.gallery_images %}
          {
            "src": {{ image.src | relative_url | jsonify }},
            "label": {{ image.label | jsonify }},
            "caption": {{ image.caption | jsonify }},
            "alt": {{ image.alt | default: image.caption | jsonify }}
          }{% unless forloop.last %},{% endunless %}
          {% endfor %}
        {% else %}
          {
            "src": {{ shelf.hero_image | relative_url | jsonify }},
            "label": "HERO IMAGE",
            "caption": {{ shelf.hero_caption | jsonify }},
            "alt": {{ shelf.hero_alt | default: shelf.hero_caption | jsonify }}
          }
        {% endif %}
      ]
    }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ]
  </script>

<!-- TOP BAR -->
<div class="photo-viewer-header">
    <a id="photoBackLink" class="photo-back-link" href="#" > &lt; BACK</a>
    <span class="photo-counter" id="photoCounter"> 1 / 1 </span>
    <button class="photo-close" id="photoClose" type="button" aria-label="Close photo viewer">×</button>
</div>

<!-- STAGE (MAIN DISPLAY) -->
<div class="photo-viewer-stage">
    <button class="photo-arrow photo-arrow-left" id="photoPrev" type="button" aria-label="Previous photo">‹</button>
    <figure class="photo-viewer-figure">
        <div class="photo-caption-section" id="photoCaptionSection">
            <span id="photoImageCaption">Image caption</span>
        </div>
        <div class="photo-zoom-frame" id="photoZoomFrame" role="button" tabindex="0" aria-pressed="false" aria-label="Magnify photo. Select to zoom in or out.">
            <img id="photoMainImage" src="" alt="" draggable="false">
        </div>
        <figcaption>
            <span id="photoObjectName">Object Name</span>
            <span aria-hidden="true"> • </span>
            <span id="photoViewLabel">[Front View]</span>
        </figcaption>
    </figure>
    <button class="photo-arrow photo-arrow-right" id="photoNext" type="button" aria-label="Next photo">›</button>
</div>

<!-- THUMBNAIL PANEL -->
<div class="photo-thumbnail-panel">
    <div class="photo-thumbnail-handle"></div>
    <nav class="photo-thumbnails" id="photoThumbnails" aria-label="Photo views">
    <!-- Thumbnails generated dynamically by JS -->
    </nav>
</div>

</main>
