---
layout: default
---
<div class="individual-object-container">
  <h2>{{ page.title }}</h2>
  <div class="object-content">
    <div class="object-visuals">
      <iframe src="{{ page.nira_embed_url }}" class="nira-frame" frameborder="0"></iframe>
    </div>
    <div class="object-details">
      <h3>Object Description</h3>
      <p>{{ content }}</p>
      
      <table class="metadata-table">
        <tr><th>Time period</th><td>{{ page.time_period }}</td></tr>
        <tr><th>Material</th><td>{{ page.material }}</td></tr>
        <tr><th>Provenance</th><td>{{ page.provenance }}</td></tr>
      </table>
    </div>
  </div>
</div>
