name: Lighthouse

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Lighthouse (${{ matrix.device }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # One page or device failing must not hide the results of the others.
      fail-fast: false
      matrix:
        include:
          # Minimum Performance score per device. Mobile is measured on a slower, throttled phone,
          # so its limit is lower. Raise these once the real photos are in and the scores are known.
          - device: desktop
            min_performance: "100"
          - device: mobile
            min_performance: "90"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "4.0.6"
          bundler-cache: true
      - name: Build local audit target
        run: bundle exec jekyll build --destination "${RUNNER_TEMP}/site/group34"
      - name: Serve local audit target
        run: |
          mkdir -p "${RUNNER_TEMP}/lighthouse"
          python3 -m http.server 4173 --directory "${RUNNER_TEMP}/site" >"${RUNNER_TEMP}/jekyll-server.log" 2>&1 &
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:4173/group34/ >/dev/null
      - name: List the pages to audit
        id: pages
        run: |
          # One path per line. Add a page here to have it audited too (paths start after /group34).
          # The photo viewer needs its ?key=... address, so it is audited with a real object.
          base="http://127.0.0.1:4173/group34"
          paths="/
          /about/
          /shelves/top-shelf/
          /shelves/middle-shelf/
          /shelves/bottom-shelf/
          /objects/middle-shelf-object3/
          /objects/bottom-shelf-object10/
          /photo/?key=%2Fgroup34%2Fobjects%2Fmiddle-shelf-object3%2F&index=0
          /privacy/
          /terms/"
          urls=$(printf '%s\n' "$paths" | sed "s|^|${base}|" | paste -sd, -)
          echo "Auditing: ${urls}"
          echo "urls=${urls}" >> "$GITHUB_OUTPUT"
      - name: Run Lighthouse
        id: lighthouse
        uses: foo-software/lighthouse-check-action@a80267da2e0244b8a2e457a8575fc47590615852 # v12.0.1
        with:
          device: ${{ matrix.device }}
          outputDirectory: ${{ runner.temp }}/lighthouse
          urls: ${{ steps.pages.outputs.urls }}
      - name: Check Lighthouse minimum scores
        uses: foo-software/lighthouse-check-status-action@2b9d5101f7a0de86ddb153a0d77ad7046aac1052 # v3.0.1
        with:
          lighthouseCheckResults: ${{ steps.lighthouse.outputs.lighthouseCheckResults }}
          # Every audited page must reach these scores. Accessibility is a hard requirement for this exhibition.
          minAccessibilityScore: "100"
          minBestPracticesScore: "100"
          minPerformanceScore: ${{ matrix.min_performance }}
          minSeoScore: "100"
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports-${{ matrix.device }}
          path: ${{ runner.temp }}/lighthouse
          if-no-files-found: error
