<div class="cookie-popup" data-cookie-popup role="dialog" aria-label="Cookie notice">
  <div>
    <p class="eyebrow">COOKIES</p>
    <p>This prototype uses a small local preference cookie to remember accessibility settings and cookie consent. No analytics are enabled in this prototype.</p>
  </div>
  <div class="cookie-actions">
    <button type="button" class="button button-dark" data-cookie-accept>Accept</button>
    <button type="button" class="button button-outline" data-cookie-dismiss>Dismiss</button>
  </div>
</div>
