<div class="cookie-banner" id="cookieBanner">
  <button onclick="closeCookieBanner()" class="cookie-close-icon" aria-label="Close">&times;</button>
  <div class="cookie-content">
    <span class="cookie-subheading">NOTE</span>
    <h2 class="cookie-title">This site uses cookies</h2>
    <p class="cookie-text">
      Cookies help us to deliver the best experience on our website. By using our website, you agree to the use of cookies. <a href="#">Find out how we use cookies.</a>
    </p>
    <div class="cookie-buttons">
      <button onclick="acceptCookies()" class="btn-cookie-accept">Accept</button>
      <button onclick="declineCookies()" class="btn-cookie-decline">Decline</button>
    </div>
  </div>
</div>
