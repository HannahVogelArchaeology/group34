<div class="bottom-audio-bar" id="bottomAudioBar" style="display: none;">
  <div class="audio-left">
    <button onclick="changeAudioSpeed(0.5)">0.5x</button>
    <button onclick="toggleAudioPlay()"><i class="fas fa-play" id="playIcon"></i></button>
    <button onclick="changeAudioSpeed(2.0)">2.0x</button>
  </div>
  <div class="audio-center">
    <span class="audio-obj-name">{{ page.object_name | default: 'Artifact Audio Story' }}</span>
    <span class="audio-shelf-label">FIRST SHELF</span>
  </div>
  <div class="audio-right">
    <button onclick="toggleMute()"><i class="fas fa-volume-up" id="volumeIcon"></i></button>
    <button onclick="alert('Transcript displayed above')"><i class="fas fa-file-alt"></i></button>
  </div>
  <audio id="exhibitionAudio" src="{{ page.audio_src | relative_url }}"></audio>
</div>
