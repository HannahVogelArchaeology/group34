<div class="bottom-audio-bar" id="bottomAudioBar" style="display: none;">
  <!-- Bar with the time -->
  <div class="audio-progress-container">
    <span id="currentTime">0:00</span>
    <input type="range" id="audioProgress" value="0" min="0" max="100" step="0.1" aria-label="Audio Seek Bar" oninput="seekAudio(this.value)">
    <span id="durationTime">0:00</span>
  </div>

  <div class="audio-controls-wrapper">
    <!-- Left control, speed and play button -->
    <div class="audio-left">
      <button type="button" onclick="changeAudioSpeed(0.5)" aria-label="Play audio at half speed">0.5x</button>
      <button type="button" onclick="toggleAudioPlay()" aria-label="Play or pause audio">
        <i class="fas fa-play" id="playIcon" aria-hidden="true"></i>
      </button>
      <button type="button" onclick="changeAudioSpeed(1.5)" aria-label="Play audio at 1.5 speed">1.5x</button>
    </div>

    <!-- Center info -->
    <div class="audio-center">
      <span class="audio-obj-name">{{ page.object_title | default: page.title }}</span>
      <span class="audio-shelf-label">{{ page.shelf_title | default: page.title }}</span>
    </div>

    <!-- Volume and transcript -->
    <div class="audio-right">
      <div class="volume-container">
        <div class="volume-popup" id="volumePopup">
          <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="1" oninput="setVolume(this.value)" aria-label="Volume Slider">
        </div>
        <button type="button" onclick="toggleVolumePopup()" aria-label="Adjust volume">
          <i class="fas fa-volume-up" id="volumeIcon" aria-hidden="true"></i>
        </button>
      </div>

      <button type="button" onclick="toggleTranscript()" aria-label="Toggle transcript">
        <i class="fas fa-list-alt" aria-hidden="true"></i>
      </button>
    </div>
  </div>

  <audio id="exhibitionAudio" src="{{ page.audio_src | relative_url }}" preload="metadata"></audio>
</div>
