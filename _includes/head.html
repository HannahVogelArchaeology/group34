<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Icons & Alpine JS for UI state management -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <!-- Prevent visual flashing on page load -->
  <script>
  (function() {
    try {
      var savedSize = localStorage.getItem('userFontSize');

      if (savedSize) {
        document.documentElement.style.fontSize = savedSize + '%';
      }

      if (!localStorage.getItem('cookieConsent')) {
        document.documentElement.classList.add('show-cookie-banner');
      }
    } catch (error) {
    // If localStorage is unavailable, show the banner normally
    document.documentElement.classList.add('show-cookie-banner');
  }
  })();
</script>

<!-- SVG Favicon -->
<link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  
<!-- Style sheet -->  
<link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
</head>
