<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self';
    script-src 'self' 'unsafe-inline';
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com;
    font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;
    img-src 'self' data:; media-src 'self'; connect-src 'self'; frame-src 'none';
    object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"
  >
  <title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:title" content="{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <!-- The three external stylesheets below load without blocking the first paint: media="print" lets the
       page draw first, and onload switches the sheet on as soon as it has arrived. The noscript copy keeps
       them working when JavaScript is off. -->
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet"></noscript>
  
  <!-- Font Awesome icons (version pinned to 6.4.0) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></noscript>

  <!-- Loading screen: shown only if the page takes longer than 2 seconds to load, and removed as soon as it has loaded -->
  <script>
  (function () {
    var SHOW_AFTER_MS = 2000;
    var GIVE_UP_AFTER_MS = 15000; /* Never keep the screen on for longer than this, even if something stalls */
    var loader = null;
    var finished = false;

    function build() {
      var overlay = document.createElement('div');
      var spinner = document.createElement('div');
      var message = document.createElement('p');
      var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      overlay.id = 'pageLoader';
      overlay.setAttribute('role', 'status');
      overlay.setAttribute('aria-live', 'polite');
      /* Styles are set from script so the screen looks right even while the main stylesheet is still loading */
      overlay.style.cssText = 'position:fixed;top:0;right:0;bottom:0;left:0;z-index:100000;display:flex;' +
        'flex-direction:column;align-items:center;justify-content:center;gap:1.25rem;background:#382713;' +
        'color:#f6f3eb;font:600 1.1rem Manrope,Arial,sans-serif;text-align:center;transition:opacity .3s ease;';

      spinner.setAttribute('aria-hidden', 'true');
      spinner.style.cssText = 'width:56px;height:56px;box-sizing:border-box;border:5px solid rgba(246,243,235,.25);' +
        'border-top-color:#d9b97e;border-radius:50%;';

      message.style.cssText = 'margin:0;padding:0 1rem;';
      message.textContent = 'Loading the exhibition\u2026';

      overlay.appendChild(spinner);
      overlay.appendChild(message);

      if (spinner.animate && !reduceMotion) {
        spinner.animate([{ transform: 'rotate(0deg)' }, { transform: 'rotate(360deg)' }], { duration: 900, iterations: Infinity });
      }

      return overlay;
    }

    function hide() {
      finished = true;
      clearTimeout(showTimer);
      clearTimeout(giveUpTimer);

      if (!loader) {
        return;
      }

      loader.style.opacity = '0';
      setTimeout(function () {
        if (loader && loader.parentNode) {
          loader.parentNode.removeChild(loader);
        }
      }, 300);
    }

    function show() {
      if (finished) {
        return;
      }

      loader = build();

      if (document.body) {
        document.body.appendChild(loader);
      } else {
        document.addEventListener('DOMContentLoaded', function () {
          if (!finished) {
            document.body.appendChild(loader);
          }
        });
      }
    }

    var showTimer = setTimeout(show, SHOW_AFTER_MS);
    var giveUpTimer = setTimeout(hide, GIVE_UP_AFTER_MS);

    window.addEventListener('load', hide);
  })();
  </script>

  <!-- Prevent visual flashing on page load -->
  <script>
  (function() {
    try {
      var savedSize = localStorage.getItem('userFontSize');

      if (savedSize) {
        document.documentElement.style.fontSize = savedSize + '%';
      }
    } catch (error) {
    // If localStorage is unavailable...
  }
  })();
</script>

<!-- Outdated browser check -->
<script>
(function () {
  var supported = false;

  try {
    supported =
      !!(window.CSS && window.CSS.supports) &&
      window.CSS.supports('(--site-test: 0)') &&   /* CSS custom properties (colours and sizes) */
      window.CSS.supports('display', 'grid') &&    /* CSS grid (page layouts) */
      window.CSS.supports('inset', '0') &&         /* inset shorthand (photo viewer, sidebar) */
      'fetch' in window &&
      'Promise' in window &&
      !!window.matchMedia &&
      !!Element.prototype.closest &&
      'noModule' in document.createElement('script'); /* modern JavaScript, which assets/js/main.js uses */
  } catch (error) {
    supported = false;
  }

  if (!supported) {
    document.documentElement.className += ' outdated-browser';
  }
})();
</script>

<!-- SVG Favicon -->
<link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">

<!-- Style sheet -->
<link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">

</head>
